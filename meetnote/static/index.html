<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议纪要助手</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d2129; --muted: #6b7280; --border: #e3e6ea;
  --accent: #2563eb; --accent-soft: #e8efff; --ok: #15803d; --ok-soft: #e7f6ec;
  --warn: #b45309; --warn-soft: #fdf3e2; --err: #b91c1c; --err-soft: #fdecec;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --card: #1a1d23; --text: #e6e8eb; --muted: #9aa1ab; --border: #2c3038;
    --accent: #6b9bff; --accent-soft: #1d2a45; --ok: #4ade80; --ok-soft: #16301f;
    --warn: #fbbf24; --warn-soft: #33270f; --err: #f87171; --err-soft: #3a1717;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
header h1 { margin: 0; font-size: 24px; flex: 1; }
header p { margin: 4px 0 24px; color: var(--muted); }
select.lang { width: auto; font-size: 13px; padding: 4px 8px; color: var(--muted); background: var(--card); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
h2 { font-size: 16px; margin: 0 0 14px; }
.drop {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 28px 16px; text-align: center;
  cursor: pointer; transition: border-color .15s, background .15s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { display: block; font-size: 16px; }
.drop span { color: var(--muted); font-size: 13px; }
.drop.has-file strong { color: var(--accent); word-break: break-all; }
label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
input[type=text], input[type=password], textarea, select {
  width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font: inherit;
}
textarea { min-height: 64px; resize: vertical; }
button {
  font: inherit; border-radius: 8px; padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; margin-top: 16px; }
.bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.hint { font-size: 13px; color: var(--muted); }
.error { color: var(--err); font-size: 14px; white-space: pre-line; }
.hidden { display: none !important; }

.job { padding: 12px 0; border-top: 1px solid var(--border); cursor: pointer; }
.job:first-of-type { border-top: 0; }
.job .name { font-weight: 600; word-break: break-all; }
.job .bar { margin-top: 6px; }
.job.active-view .name { color: var(--accent); }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.queued, .pill.transcribing, .pill.summarizing { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.failed { background: var(--err-soft); color: var(--err); }
.spacer { flex: 1; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 16px 0 0; flex-wrap: wrap; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.doc { padding: 8px 2px 0; overflow-wrap: anywhere; }
.doc h1 { font-size: 22px; } .doc h2 { font-size: 18px; margin-top: 24px; } .doc h3 { font-size: 16px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
.doc th, .doc td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
.doc th { background: var(--bg); }
.doc blockquote { margin: 12px 0; padding: 4px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.doc pre { white-space: pre-wrap; font: 14px/1.7 inherit; font-family: inherit; margin: 0; }
.doc hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }

@media print {
  body { background: #fff; color: #000; font-size: 12px; }
  main { max-width: none; padding: 0; }
  header, .card:not(#detail), #detail > :not(.doc), .tabs { display: none !important; }
  #detail { border: 0; padding: 0; }
  .doc th { background: #f2f2f2; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="row" style="align-items:flex-start">
      <h1 data-i18n="appTitle">会议纪要助手</h1>
      <select id="langSel" class="lang" aria-label="Language / 语言 / Sprache">
        <option value="zh">中文</option><option value="en">English</option><option value="de">Deutsch</option>
      </select>
    </div>
    <p data-i18n="tagline">上传会议录音，几分钟后得到转写稿、全文梗概和两页精华。</p>
  </header>

  <section class="card hidden" id="gate">
    <h2 data-i18n="gateTitle">请输入访问码</h2>
    <div class="row">
      <input type="password" id="code" data-i18n-ph="codePh" placeholder="访问码" style="flex:1;min-width:180px">
      <button class="primary" id="codeBtn" data-i18n="enter">进入</button>
    </div>
    <p class="error" id="codeErr"></p>
  </section>

  <section class="card hidden" id="upload">
    <h2 data-i18n="newNotes">新建纪要</h2>
    <div class="drop" id="drop">
      <strong id="dropTitle"></strong>
      <span id="dropHint"></span>
    </div>
    <input type="file" id="file" class="hidden" accept="audio/*,video/*" multiple>
    <label for="context" data-i18n="contextLabel">会议背景（选填，帮助理解上下文和纠正术语）</label>
    <textarea id="context" data-i18n-ph="contextPh"></textarea>
    <label for="terms" data-i18n="termsLabel">人名 / 术语（选填，逗号分隔，提高识别准确率）</label>
    <input type="text" id="terms" data-i18n-ph="termsPh">
    <div class="row" style="gap:16px">
      <div style="flex:1;min-width:180px">
        <label for="language" data-i18n="recLang">录音语言</label>
        <select id="language"><option value="auto" data-i18n="autoDetect">自动识别</option></select>
      </div>
      <div style="flex:1;min-width:180px">
        <label for="summaryLang" data-i18n="sumLang">纪要语言</label>
        <select id="summaryLang"><option value="auto" data-i18n="sameAsRec">跟录音语言一致</option></select>
      </div>
      <div style="flex:1;min-width:140px">
        <label for="numSpeakers" data-i18n="headcount">参会人数</label>
        <select id="numSpeakers" data-i18n-title="headcountTip"></select>
      </div>
    </div>
    <div class="bar hidden" id="upBar" style="margin-top:16px"><div></div></div>
    <p class="error" id="upErr"></p>
    <div class="row end">
      <span class="hint" id="upHint"></span>
      <button class="primary" id="submit" data-i18n="start" disabled>开始生成</button>
    </div>
  </section>

  <section class="card hidden" id="list">
    <div class="row"><h2 style="margin:0" data-i18n="myJobs">我的任务</h2><span class="spacer"></span>
      <span class="hint" data-i18n="myJobsHint">只显示在这个浏览器里提交或打开过的任务</span></div>
    <div id="jobs" style="margin-top:8px"></div>
  </section>

  <section class="card hidden" id="detail">
    <div class="row">
      <h2 id="dTitle" style="margin:0;word-break:break-all;flex:1;min-width:200px"></h2>
      <span class="pill" id="dPill"></span>
    </div>
    <p class="hint" id="dMeta" style="margin:6px 0 0"></p>
    <div id="dProgress" class="hidden" style="margin-top:12px">
      <div class="bar"><div></div></div>
      <p class="hint" id="dMsg" style="margin:6px 0 0"></p>
    </div>
    <p class="error" id="dErr"></p>
    <div class="row" id="dActions" style="margin-top:12px">
      <button id="dZip" class="primary" data-i18n="dlAll">下载全部</button>
      <button id="dDownload" data-i18n="dlCurrent">下载当前</button>
      <button id="dPrint" data-i18n="print">打印 / 存 PDF</button>
      <button id="dShare" data-i18n="share">复制分享链接</button>
      <button id="dAudio" class="hidden" data-i18n="dlAudio">下载合并录音</button>
      <button id="dRetry" class="hidden" data-i18n="retry">重新生成总结</button>
    </div>
    <details id="dSpeakers" class="hidden" style="margin-top:14px">
      <summary class="hint" style="cursor:pointer"><span data-i18n="spkSummary">说话人（自动区分）</span>: <span id="dSpkList"></span> · <span data-i18n="spkName">填写姓名</span></summary>
      <p class="hint" style="margin:8px 0 4px" data-i18n="spkHelp"></p>
      <div class="row" id="dSpkInputs"></div>
      <div class="row end" style="margin-top:8px"><button id="dSpkSave" data-i18n="spkSave">保存并重新生成纪要</button></div>
    </details>
    <div class="tabs" id="dTabs"></div>
    <div class="doc" id="dDoc"></div>
  </section>
</main>

  [/^处理时发生内部错误，请联系管理员查看服务日志$/, "Internal error while processing; ask the administrator to check the service log"],
  [/^任务不存在或已过期$/, "Job not found or expired"], [/^文件不存在$/, "File not found"],
  [/^不支持的文件类型 (.+)，请上传音频或视频文件$/, "Unsupported file type $1; please upload an audio or video file"],
  [/^不支持的语言：(.+)$/, "Unsupported language: $1"], [/^参会人数应在 1–20 之间$/, "Participants must be between 1 and 20"],
  [/^文件超过 (\d+) MB$/, "File is larger than $1 MB"], [/^任务还在处理中$/, "The job is still running"],
  [/^还没有转写稿，无法生成总结$/, "There is no transcript yet, so summaries can't be generated"],
  [/^转写稿里没有说话人 (.+)（现有：(.*)）$/, "No speaker $1 in the transcript (existing: $2)"],
];
const SERVER_DE = [
  [/^排队中$/, "Wartet"], [/^正在转写$/, "Transkription läuft"], [/^正在生成总结$/, "Protokoll wird erstellt"], [/^完成$/, "Fertig"],
  [/^服务重启，重新排队$/, "Nach Neustart des Dienstes erneut eingereiht"],
  [/^正在逐段整理要点$/, "Notizen werden abschnittsweise extrahiert"], [/^正在合并录音$/, "Aufnahmen werden zusammengefügt"],
  [/^一次最多 (\d+) 个文件$/, "Höchstens $1 Dateien pro Auftrag"],
  [/^正在撰写《(.+)》$/, (m, d) => `Schreibe: ${docDe(d)}`],
  [/^正在核查《(.+)》$/, (m, d) => `Faktencheck: ${docDe(d)}`],
  [/^正在修订《(.+)》$/, (m, d) => `Überarbeite: ${docDe(d)}`],
  [/^转写稿已生成，可稍后重新生成总结$/, "Das Transkript ist fertig; das Protokoll kann später neu erstellt werden"],
  [/^转写失败：([\s\S]*)（请确认上传的是有效的音频文件）$/, "Transkription fehlgeschlagen: $1 (ist die Datei eine gültige Audiodatei?)"],
  [/^总结失败：([\s\S]*)$/, "Zusammenfassen fehlgeschlagen: $1"],
  [/^处理时发生内部错误，请联系管理员查看服务日志$/, "Interner Fehler bei der Verarbeitung; bitte die Administration das Dienstprotokoll prüfen lassen"],
  [/^任务不存在或已过期$/, "Auftrag nicht gefunden oder abgelaufen"], [/^文件不存在$/, "Datei nicht gefunden"],
  [/^不支持的文件类型 (.+)，请上传音频或视频文件$/, "Nicht unterstützter Dateityp $1; bitte eine Audio- oder Videodatei hochladen"],
  [/^不支持的语言：(.+)$/, "Nicht unterstützte Sprache: $1"], [/^参会人数应在 1–20 之间$/, "Teilnehmende müssen zwischen 1 und 20 liegen"],
  [/^文件超过 (\d+) MB$/, "Datei ist größer als $1 MB"], [/^任务还在处理中$/, "Der Auftrag läuft noch"],
  [/^还没有转写稿，无法生成总结$/, "Noch kein Transkript, daher kann kein Protokoll erstellt werden"],
  [/^转写稿里没有说话人 (.+)（现有：(.*)）$/, "Kein Sprecher $1 im Transkript (vorhanden: $2)"],
];
const SERVER = { en: SERVER_EN, de: SERVER_DE };
const HTML_LANG = { zh: "zh-CN", en: "en", de: "de" };
const DATE_LOCALE = { zh: "zh-CN", en: "en-GB", de: "de-DE" };

let uiLang = (() => {
  try { const v = localStorage.getItem("mn_ui_lang"); if (v in I18N) return v; } catch {}
  const nav = (navigator.language || "").toLowerCase();
  return nav.startsWith("zh") ? "zh" : nav.startsWith("de") ? "de" : "en";
})();
function t(key, vars = {}) {
  const s = I18N[uiLang][key] ?? I18N.zh[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
}
function srv(text) {
  if (!text || uiLang === "zh") return text;
  for (const [re, out] of SERVER[uiLang]) if (re.test(text)) return text.replace(re, out);
  return text;
}
function applyStatic() {
  document.documentElement.lang = HTML_LANG[uiLang];
  document.title = t("appTitle");
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));
  document.querySelectorAll("[data-i18n-title]").forEach((el) => (el.title = t(el.dataset.i18nTitle)));
  $("langSel").value = uiLang;
  const sel = $("numSpeakers"), keep = sel.value || "0";
  sel.innerHTML = "";
  sel.add(new Option(t("estimate"), "0"));
  for (const n of [1, 2, 3, 4, 5, 6, 7, 8, 10]) sel.add(new Option(t("people", { n }), String(n)));
  sel.value = keep;
  choose(chosen);
}

const TAB_KEYS = [
  ["highlights", "tabHighlights"], ["synopsis", "tabSynopsis"], ["notes", "tabNotes"], ["checks", "tabChecks"],
  ["transcript", "tabTranscript"], ["subtitles", "tabSubtitles"],
];
const ACTIVE = ["queued", "transcribing", "summarizing"];
const $ = (id) => document.getElementById(id);

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let jobIds = store.get("mn_jobs", []);
const jobs = {};
let current = null, currentTab = "highlights", docCache = {}, timer = null;

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (res.status === 401) { showGate(t("codeChanged")); throw new Error("unauthorized"); }
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch {}
    throw new Error(srv(msg));
  }
  return res;
}

function setCode(code) {
  document.cookie = `mn_code=${encodeURIComponent(code)}; path=/; max-age=31536000; SameSite=Strict`;
}
function showGate(err) {
  $("gate").classList.remove("hidden");
  ["upload", "list", "detail"].forEach((id) => $(id).classList.add("hidden"));
  $("codeErr").textContent = err || "";
}
$("codeBtn").onclick = async () => {
  setCode($("code").value.trim());
  try { await api("/api/jobs/" + "0".repeat(32)); } catch (e) { if (e.message === "unauthorized") return; }
  $("gate").classList.add("hidden");
  start();
};
$("code").onkeydown = (e) => { if (e.key === "Enter") $("codeBtn").click(); };

// ---------- upload ----------
let chosen = [];
const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
function choose(files) {
  chosen = [...(files || [])].sort((a, b) => collator.compare(a.name, b.name));
  const n = chosen.length, size = (chosen.reduce((s, f) => s + f.size, 0) / 1e6).toFixed(1);
  $("drop").classList.toggle("has-file", n > 0);
  if (n === 0) {
    $("dropTitle").textContent = t("dropTitle");
    $("dropHint").textContent = t("dropHint");
  } else if (n === 1) {
    $("dropTitle").textContent = chosen[0].name;
    $("dropHint").textContent = t("fileChosen", { size });
  } else {
    $("dropTitle").textContent = t("filesChosen", { n });
    const names = chosen.map((f) => f.name);
    $("dropHint").textContent = (n > 6 ? [...names.slice(0, 3), "…", ...names.slice(-2)] : names).join(" → ")
      + " · " + t("filesSize", { size });
  }
  $("submit").disabled = n === 0;
  $("upErr").textContent = "";
}
$("drop").onclick = () => $("file").click();
$("file").onchange = () => choose($("file").files);
["dragenter", "dragover"].forEach((ev) => $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => { if (e.dataTransfer.files.length) choose(e.dataTransfer.files); });

$("submit").onclick = () => {
  if (!chosen.length) return;
  const fd = new FormData();
  for (const f of chosen) fd.append("file", f);
  fd.append("context", $("context").value);
  fd.append("terms", $("terms").value);
  fd.append("language", $("language").value);
  fd.append("summary_lang", $("summaryLang").value);
  fd.append("num_speakers", $("numSpeakers").value);
  store.set("mn_langs", [$("language").value, $("summaryLang").value]);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/jobs");
  $("submit").disabled = true;
  $("upBar").classList.remove("hidden");
  $("upErr").textContent = "";
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    const pct = (e.loaded / e.total) * 100;
    $("upBar").firstElementChild.style.width = pct + "%";
    $("upHint").textContent = pct < 100 ? t("uploading", { pct: pct.toFixed(0) }) : t("uploaded");
  };
  xhr.onload = () => {
    $("upBar").classList.add("hidden");
    $("upHint").textContent = "";
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status === 401) { showGate(t("wrongCode")); return; }
    if (xhr.status !== 200) { $("upErr").textContent = srv(data.detail) || t("uploadFailed"); $("submit").disabled = false; return; }
    remember(data);
    choose([]); $("file").value = ""; $("context").value = ""; $("terms").value = "";
    open(data.id);
  };
  xhr.onerror = () => { $("upErr").textContent = t("netError"); $("submit").disabled = false; $("upBar").classList.add("hidden"); };
  xhr.send(fd);
};

// ---------- job list ----------
function remember(job) {
  jobs[job.id] = job;
  if (!jobIds.includes(job.id)) { jobIds.unshift(job.id); store.set("mn_jobs", jobIds.slice(0, 50)); }
  renderList();
}
function fmtTime(ts) {
  return ts ? new Date(ts * 1000).toLocaleString(DATE_LOCALE[uiLang], { hour12: false }).slice(0, -3) : "";
}
function fmtDur(s) {
  if (!s) return "";
  s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? t("hm", { h, m }) : t("ms", { m, s: s % 60 });
}
function statusLine(j) {
  if (j.status === "queued") return j.jobs_ahead > 0 ? t("ahead", { n: j.jobs_ahead }) : t("soon");
  if (j.status === "transcribing") return t("transcribingPct", { pct: Math.floor(j.progress || 0) });
  if (j.status === "summarizing") return srv(j.message) || t("generating");
  if (j.status === "failed") return srv(j.error) || t("failed");
  return t("doneLine", { dur: fmtDur(j.duration) });
}
function renderList() {
  const known = jobIds.filter((id) => jobs[id]);
  $("list").classList.toggle("hidden", known.length === 0);
  $("jobs").innerHTML = "";
  for (const id of known) {
    const j = jobs[id];
    const el = document.createElement("div");
    el.className = "job" + (id === current ? " active-view" : "");
    el.innerHTML = `<div class="row"><span class="name"></span><span class="spacer"></span><span class="pill ${j.status}">${t(j.status)}</span></div>
      <div class="hint"><span class="when"></span> · <span class="line"></span></div>
      ${ACTIVE.includes(j.status) ? `<div class="bar"><div style="width:${j.status === "summarizing" ? 100 : j.progress || 0}%"></div></div>` : ""}`;
    el.querySelector(".name").textContent = j.filename;
    el.querySelector(".when").textContent = fmtTime(j.created_at);
    el.querySelector(".line").textContent = statusLine(j);
    el.onclick = () => open(id);
    $("jobs").appendChild(el);
  }
}

async function refresh(id) {
  try {
    const j = await (await api(`/api/jobs/${id}`)).json();
    const before = jobs[id];
    jobs[id] = j;
    if (before && before.files.length !== j.files.length) docCache = {};
    return j;
  } catch (e) {
    if (e.message !== "unauthorized") { jobIds = jobIds.filter((x) => x !== id); store.set("mn_jobs", jobIds); }
    return null;
  }
}

async function poll() {
  clearTimeout(timer);
  const active = jobIds.filter((id) => jobs[id] && ACTIVE.includes(jobs[id].status));
  await Promise.all(active.map(refresh));
  renderList();
  if (current && jobs[current]) renderDetail();
  if (jobIds.some((id) => jobs[id] && ACTIVE.includes(jobs[id].status))) timer = setTimeout(poll, 2000);
}

// ---------- detail ----------
async function open(id) {
  if (!jobs[id]) {
    const j = await refresh(id);
    if (!j) { alert(t("notFound")); history.replaceState(null, "", location.pathname); return; }
    remember(j);
  }
  if (current !== id) { current = id; docCache = {}; currentTab = "highlights"; }
  history.replaceState(null, "", `#job=${id}`);
  renderList();
  renderDetail();
  $("detail").scrollIntoView({ behavior: "smooth", block: "start" });
  poll();
}

function renderDetail() {
  const j = jobs[current];
  $("detail").classList.remove("hidden");
  $("dTitle").textContent = j.filename;
  $("dPill").className = `pill ${j.status}`;
  $("dPill").textContent = t(j.status);
  $("dMeta").textContent = [
    t("submitted", { t: fmtTime(j.created_at) }),
    fmtDur(j.duration) && t("durationIs", { d: fmtDur(j.duration) }),
    j.parts > 1 && t("mergedFrom", { n: j.parts }),
    j.detected_language && t("langIs", { l: langName(j.detected_language) }) + (j.language === "auto" ? t("autoTag") : ""),
    j.summary_lang && j.summary_lang !== "auto" && t("notesIn", { l: langName(j.summary_lang) }),
    j.context && t("contextIs", { c: j.context }),
  ].filter(Boolean).join(" · ");

  const active = ACTIVE.includes(j.status);
  $("dProgress").classList.toggle("hidden", !active);
  if (active) {
    $("dProgress").querySelector(".bar > div").style.width = (j.status === "summarizing" ? 100 : j.progress || 0) + "%";
    $("dMsg").textContent = statusLine(j) + (j.status === "transcribing" ? t("perHour") : "");
  }
  $("dErr").textContent = j.status === "failed" ? [srv(j.error) || t("processFailed"), srv(j.message)].filter(Boolean).join("\n") : "";
  $("dRetry").classList.toggle("hidden", !(j.status === "failed" && j.files.includes("transcript")));
  $("dActions").classList.toggle("hidden", j.files.length === 0 && !active);
  ["dZip", "dDownload", "dPrint"].forEach((b) => $(b).classList.toggle("hidden", j.files.length === 0));
  $("dAudio").classList.toggle("hidden", !j.merged_audio);

  renderSpeakers(j, active);

  const tabs = TAB_KEYS.filter(([k]) => j.files.includes(k));
  if (!tabs.some(([k]) => k === currentTab) && tabs.length) currentTab = tabs[0][0];
  $("dTabs").innerHTML = "";
  for (const [k, label] of tabs) {
    const b = document.createElement("button");
    b.textContent = t(label);
    b.className = k === currentTab ? "on" : "";
    b.onclick = () => { currentTab = k; renderDetail(); };
    $("dTabs").appendChild(b);
  }
  renderDoc(tabs.length ? currentTab : null);
}

function renderSpeakers(j, active) {
  const spk = j.speakers || [];
  $("dSpeakers").classList.toggle("hidden", spk.length === 0 || active);
  $("dSpkList").textContent = spk.join(t("listSep"));
  const box = $("dSpkInputs");
  if (box.dataset.for === current + spk.join("|")) {  // keep what the user is typing
    box.querySelectorAll("input").forEach((i) => (i.placeholder = t("spkPh")));
    return;
  }
  box.dataset.for = current + spk.join("|");
  box.innerHTML = "";
  for (const label of spk) {
    const wrap = document.createElement("div");
    wrap.style.cssText = "flex:1;min-width:150px";
    const l = document.createElement("label");
    l.textContent = label;
    const input = document.createElement("input");
    input.type = "text"; input.dataset.label = label; input.placeholder = t("spkPh");
    wrap.append(l, input);
    box.appendChild(wrap);
  }
}

$("dSpkSave").onclick = async () => {
  const names = {};
  for (const input of $("dSpkInputs").querySelectorAll("input")) {
    if (input.value.trim()) names[input.dataset.label] = input.value.trim();
  }
  if (!Object.keys(names).length) return;
  try {
    jobs[current] = await (await api(`/api/jobs/${current}/speakers`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ names }),
    })).json();
  } catch (e) { alert(e.message); return; }
  docCache = {};
  $("dSpeakers").open = false;
  renderDetail(); renderList(); poll();
};

async function renderDoc(key) {
  const doc = $("dDoc");
  if (!key) { doc.innerHTML = ""; return; }
  if (!(key in docCache)) {
    docCache[key] = null;
    try { docCache[key] = await (await api(`/api/jobs/${current}/files/${key}?inline=1`)).text(); }
    catch (e) { delete docCache[key]; doc.textContent = t("loadFailed", { e: e.message }); return; }
  }
  if (key !== currentTab) return;
  const text = docCache[key];
  if (text === null) { doc.textContent = t("loading"); return; }
  const plain = key === "transcript" || key === "subtitles";
  if (plain || !window.marked || !window.DOMPurify) {
    doc.innerHTML = "<pre></pre>";
    doc.firstChild.textContent = text;
  } else {
    doc.innerHTML = DOMPurify.sanitize(marked.parse(text));
  }
}

$("dZip").onclick = () => { location.href = `/api/jobs/${current}/zip`; };
$("dDownload").onclick = () => { location.href = `/api/jobs/${current}/files/${currentTab}`; };
$("dPrint").onclick = () => window.print();
$("dAudio").onclick = () => { location.href = `/api/jobs/${current}/audio`; };
$("dShare").onclick = async () => {
  const url = `${location.origin}/#job=${current}`;
  try { await navigator.clipboard.writeText(url); $("dShare").textContent = t("copied"); }
  catch { prompt(t("copyPrompt"), url); }
  setTimeout(() => ($("dShare").textContent = t("share")), 2000);
};
$("dRetry").onclick = async () => {
  try { jobs[current] = await (await api(`/api/jobs/${current}/resummarize`, { method: "POST" })).json(); }
  catch (e) { alert(e.message); return; }
  renderDetail(); renderList(); poll();
};

$("langSel").onchange = () => {
  uiLang = $("langSel").value;
  try { localStorage.setItem("mn_ui_lang", uiLang); } catch {}
  applyStatic();
  renderList();
  if (current && jobs[current]) renderDetail();
};

// A share link opened in a tab that already shows this page only changes the hash
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/job=([0-9a-f]{32})/);
  if (m && m[1] !== current) open(m[1]);
});

// ---------- start ----------
let LANGS = {};
const langName = (code) => LANGS[code] || code;

function fillLanguages() {
  const [lang, sumLang] = store.get("mn_langs", ["auto", "auto"]);
  for (const [sel, saved] of [[$("language"), lang], [$("summaryLang"), sumLang]]) {
    for (const [code, name] of Object.entries(LANGS)) sel.add(new Option(name, code));
    if ([...sel.options].some((o) => o.value === saved)) sel.value = saved;
  }
}

async function start() {
  $("upload").classList.remove("hidden");
  await Promise.all(jobIds.map(refresh));
  renderList();
  const m = location.hash.match(/job=([0-9a-f]{32})/);
  if (m) open(m[1]); else poll();
}

applyStatic();
(async () => {
  let cfg = {};
  try { cfg = await (await fetch("/api/config")).json(); } catch {}
  LANGS = cfg.languages || {};
  fillLanguages();
  if (cfg.access_code_required) {
    const hadCode = document.cookie.includes("mn_code=");
    const res = await fetch("/api/jobs/" + "0".repeat(32));
    if (res.status === 401) { showGate(hadCode ? t("codeRotated") : ""); return; }
  }
  start();
})();
</script>
</body>
</html>
