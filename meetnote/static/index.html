<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议纪要助手</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d2129; --muted: #6b7280; --border: #e3e6ea;
  --accent: #2563eb; --accent-soft: #e8efff; --ok: #15803d; --ok-soft: #e7f6ec;
  --warn: #b45309; --warn-soft: #fdf3e2; --err: #b91c1c; --err-soft: #fdecec;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --card: #1a1d23; --text: #e6e8eb; --muted: #9aa1ab; --border: #2c3038;
    --accent: #6b9bff; --accent-soft: #1d2a45; --ok: #4ade80; --ok-soft: #16301f;
    --warn: #fbbf24; --warn-soft: #33270f; --err: #f87171; --err-soft: #3a1717;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
header h1 { margin: 0; font-size: 24px; }
header p { margin: 4px 0 24px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
h2 { font-size: 16px; margin: 0 0 14px; }
.drop {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 28px 16px; text-align: center;
  cursor: pointer; transition: border-color .15s, background .15s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { display: block; font-size: 16px; }
.drop span { color: var(--muted); font-size: 13px; }
.drop.has-file strong { color: var(--accent); word-break: break-all; }
label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
input[type=text], input[type=password], textarea, select {
  width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font: inherit;
}
textarea { min-height: 64px; resize: vertical; }
button {
  font: inherit; border-radius: 8px; padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; margin-top: 16px; }
.bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.hint { font-size: 13px; color: var(--muted); }
.error { color: var(--err); font-size: 14px; white-space: pre-line; }
.hidden { display: none !important; }

.job { padding: 12px 0; border-top: 1px solid var(--border); cursor: pointer; }
.job:first-of-type { border-top: 0; }
.job .name { font-weight: 600; word-break: break-all; }
.job .bar { margin-top: 6px; }
.job.active-view .name { color: var(--accent); }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.queued, .pill.transcribing, .pill.summarizing { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.failed { background: var(--err-soft); color: var(--err); }
.spacer { flex: 1; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 16px 0 0; flex-wrap: wrap; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.doc { padding: 8px 2px 0; overflow-wrap: anywhere; }
.doc h1 { font-size: 22px; } .doc h2 { font-size: 18px; margin-top: 24px; } .doc h3 { font-size: 16px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
.doc th, .doc td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
.doc th { background: var(--bg); }
.doc blockquote { margin: 12px 0; padding: 4px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.doc pre { white-space: pre-wrap; font: 14px/1.7 inherit; font-family: inherit; margin: 0; }
.doc hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }

@media print {
  body { background: #fff; color: #000; font-size: 12px; }
  main { max-width: none; padding: 0; }
  header, .card:not(#detail), #detail > :not(.doc), .tabs { display: none !important; }
  #detail { border: 0; padding: 0; }
  .doc th { background: #f2f2f2; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>会议纪要助手</h1>
    <p>上传会议录音，几分钟后得到转写稿、全文梗概和两页精华。</p>
  </header>

  <section class="card hidden" id="gate">
    <h2>请输入访问码</h2>
    <div class="row">
      <input type="password" id="code" placeholder="访问码" style="flex:1;min-width:180px">
      <button class="primary" id="codeBtn">进入</button>
    </div>
    <p class="error" id="codeErr"></p>
  </section>

  <section class="card hidden" id="upload">
    <h2>新建纪要</h2>
    <div class="drop" id="drop">
      <strong id="dropTitle">点击选择或拖入录音文件</strong>
      <span id="dropHint">支持 m4a、mp3、wav、mp4 等常见音视频格式</span>
    </div>
    <input type="file" id="file" class="hidden" accept="audio/*,video/*">
    <label for="context">会议背景（选填，帮助理解上下文和纠正术语）</label>
    <textarea id="context" placeholder="例如：产品团队两位负责人讨论季度路线"></textarea>
    <label for="terms">人名 / 术语（选填，逗号分隔，提高识别准确率）</label>
    <input type="text" id="terms" placeholder="例如：Kubernetes, OKR, 张伟">
    <div class="row" style="gap:16px">
      <div style="flex:1;min-width:180px">
        <label for="language">录音语言</label>
        <select id="language"><option value="auto">自动识别</option></select>
      </div>
      <div style="flex:1;min-width:180px">
        <label for="summaryLang">纪要语言</label>
        <select id="summaryLang"><option value="auto">跟录音语言一致</option></select>
      </div>
      <div style="flex:1;min-width:140px">
        <label for="numSpeakers">参会人数</label>
        <select id="numSpeakers" title="知道人数就选上，区分说话人会准很多">
          <option value="0">自动估计</option>
          <option value="1">1 人</option><option value="2">2 人</option><option value="3">3 人</option>
          <option value="4">4 人</option><option value="5">5 人</option><option value="6">6 人</option>
          <option value="7">7 人</option><option value="8">8 人</option><option value="10">10 人</option>
        </select>
      </div>
    </div>
    <div class="bar hidden" id="upBar" style="margin-top:16px"><div></div></div>
    <p class="error" id="upErr"></p>
    <div class="row end">
      <span class="hint" id="upHint"></span>
      <button class="primary" id="submit" disabled>开始生成</button>
    </div>
  </section>

  <section class="card hidden" id="list">
    <div class="row"><h2 style="margin:0">我的任务</h2><span class="spacer"></span>
      <span class="hint">只显示在这个浏览器里提交或打开过的任务</span></div>
    <div id="jobs" style="margin-top:8px"></div>
  </section>

  <section class="card hidden" id="detail">
    <div class="row">
      <h2 id="dTitle" style="margin:0;word-break:break-all;flex:1;min-width:200px"></h2>
      <span class="pill" id="dPill"></span>
    </div>
    <p class="hint" id="dMeta" style="margin:6px 0 0"></p>
    <div id="dProgress" class="hidden" style="margin-top:12px">
      <div class="bar"><div></div></div>
      <p class="hint" id="dMsg" style="margin:6px 0 0"></p>
    </div>
    <p class="error" id="dErr"></p>
    <div class="row" id="dActions" style="margin-top:12px">
      <button id="dZip" class="primary">下载全部</button>
      <button id="dDownload">下载当前</button>
      <button id="dPrint">打印 / 存 PDF</button>
      <button id="dShare">复制分享链接</button>
      <button id="dRetry" class="hidden">重新生成总结</button>
    </div>
    <details id="dSpeakers" class="hidden" style="margin-top:14px">
      <summary class="hint" style="cursor:pointer">说话人（自动区分）：<span id="dSpkList"></span> · 填写姓名</summary>
      <p class="hint" style="margin:8px 0 4px">先在“转写稿”里看每个标签说了什么，再填上姓名。同一个人被分成两个标签时，填同一个名字即可。保存后会用新名字重新生成纪要。</p>
      <div class="row" id="dSpkInputs"></div>
      <div class="row end" style="margin-top:8px"><button id="dSpkSave">保存并重新生成纪要</button></div>
    </details>
    <div class="tabs" id="dTabs"></div>
    <div class="doc" id="dDoc"></div>
  </section>
</main>

<script>
const TABS = [
  ["highlights", "两页精华"], ["synopsis", "全文梗概"], ["notes", "要点笔记"], ["checks", "核查记录"],
  ["transcript", "转写稿"], ["subtitles", "字幕 (srt)"],
];
const STATUS = { queued: "排队中", transcribing: "转写中", summarizing: "总结中", done: "已完成", failed: "失败" };
const ACTIVE = ["queued", "transcribing", "summarizing"];
const $ = (id) => document.getElementById(id);

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let jobIds = store.get("mn_jobs", []);
const jobs = {};
let current = null, currentTab = "highlights", docCache = {}, timer = null;

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (res.status === 401) { showGate("访问码错误或已更改，请重新输入"); throw new Error("unauthorized"); }
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return res;
}

function setCode(code) {
  document.cookie = `mn_code=${encodeURIComponent(code)}; path=/; max-age=31536000; SameSite=Strict`;
}
function showGate(err) {
  $("gate").classList.remove("hidden");
  ["upload", "list", "detail"].forEach((id) => $(id).classList.add("hidden"));
  $("codeErr").textContent = err || "";
}
$("codeBtn").onclick = async () => {
  setCode($("code").value.trim());
  try { await api("/api/jobs/" + "0".repeat(32)); } catch (e) { if (e.message === "unauthorized") return; }
  $("gate").classList.add("hidden");
  start();
};
$("code").onkeydown = (e) => { if (e.key === "Enter") $("codeBtn").click(); };

// ---------- upload ----------
let chosen = null;
function choose(file) {
  chosen = file;
  $("drop").classList.toggle("has-file", !!file);
  $("dropTitle").textContent = file ? file.name : "点击选择或拖入录音文件";
  $("dropHint").textContent = file ? `${(file.size / 1e6).toFixed(1)} MB · 点击可更换` : "支持 m4a、mp3、wav、mp4 等常见音视频格式";
  $("submit").disabled = !file;
  $("upErr").textContent = "";
}
$("drop").onclick = () => $("file").click();
$("file").onchange = () => choose($("file").files[0] || null);
["dragenter", "dragover"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => { if (e.dataTransfer.files[0]) choose(e.dataTransfer.files[0]); });

$("submit").onclick = () => {
  if (!chosen) return;
  const fd = new FormData();
  fd.append("file", chosen);
  fd.append("context", $("context").value);
  fd.append("terms", $("terms").value);
  fd.append("language", $("language").value);
  fd.append("summary_lang", $("summaryLang").value);
  fd.append("num_speakers", $("numSpeakers").value);
  store.set("mn_langs", [$("language").value, $("summaryLang").value]);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/jobs");
  $("submit").disabled = true;
  $("upBar").classList.remove("hidden");
  $("upErr").textContent = "";
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    const pct = (e.loaded / e.total) * 100;
    $("upBar").firstElementChild.style.width = pct + "%";
    $("upHint").textContent = pct < 100 ? `上传中 ${pct.toFixed(0)}%` : "上传完成，正在排队…";
  };
  xhr.onload = () => {
    $("upBar").classList.add("hidden");
    $("upHint").textContent = "";
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status === 401) { showGate("访问码错误，请重新输入"); return; }
    if (xhr.status !== 200) { $("upErr").textContent = data.detail || "上传失败"; $("submit").disabled = false; return; }
    remember(data);
    choose(null); $("file").value = ""; $("context").value = ""; $("terms").value = "";
    open(data.id);
  };
  xhr.onerror = () => { $("upErr").textContent = "网络错误，上传失败"; $("submit").disabled = false; $("upBar").classList.add("hidden"); };
  xhr.send(fd);
};

// ---------- job list ----------
function remember(job) {
  jobs[job.id] = job;
  if (!jobIds.includes(job.id)) { jobIds.unshift(job.id); store.set("mn_jobs", jobIds.slice(0, 50)); }
  renderList();
}
function fmtTime(t) { return t ? new Date(t * 1000).toLocaleString("zh-CN", { hour12: false }).slice(0, -3) : ""; }
function fmtDur(s) {
  if (!s) return "";
  s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h} 小时 ${m} 分` : `${m} 分 ${s % 60} 秒`;
}
function statusLine(j) {
  if (j.status === "queued") return j.jobs_ahead > 0 ? `前面还有 ${j.jobs_ahead} 个任务` : "即将开始";
  if (j.status === "transcribing") return `转写中 ${Math.floor(j.progress || 0)}%`;
  if (j.status === "summarizing") return j.message || "正在生成总结";
  if (j.status === "failed") return j.error || "失败";
  return `完成 · ${fmtDur(j.duration)}`;
}
function renderList() {
  const known = jobIds.filter((id) => jobs[id]);
  $("list").classList.toggle("hidden", known.length === 0);
  $("jobs").innerHTML = "";
  for (const id of known) {
    const j = jobs[id];
    const el = document.createElement("div");
    el.className = "job" + (id === current ? " active-view" : "");
    el.innerHTML = `<div class="row"><span class="name"></span><span class="spacer"></span><span class="pill ${j.status}">${STATUS[j.status]}</span></div>
      <div class="hint"><span class="when"></span> · <span class="line"></span></div>
      ${ACTIVE.includes(j.status) ? `<div class="bar"><div style="width:${j.status === "summarizing" ? 100 : j.progress || 0}%"></div></div>` : ""}`;
    el.querySelector(".name").textContent = j.filename;
    el.querySelector(".when").textContent = fmtTime(j.created_at);
    el.querySelector(".line").textContent = statusLine(j);
    el.onclick = () => open(id);
    $("jobs").appendChild(el);
  }
}

async function refresh(id) {
  try {
    const j = await (await api(`/api/jobs/${id}`)).json();
    const before = jobs[id];
    jobs[id] = j;
    if (before && before.files.length !== j.files.length) docCache = {};
    return j;
  } catch (e) {
    if (e.message !== "unauthorized") { jobIds = jobIds.filter((x) => x !== id); store.set("mn_jobs", jobIds); }
    return null;
  }
}

async function poll() {
  clearTimeout(timer);
  const active = jobIds.filter((id) => jobs[id] && ACTIVE.includes(jobs[id].status));
  await Promise.all(active.map(refresh));
  renderList();
  if (current && jobs[current]) renderDetail();
  if (jobIds.some((id) => jobs[id] && ACTIVE.includes(jobs[id].status))) timer = setTimeout(poll, 2000);
}

// ---------- detail ----------
async function open(id) {
  if (!jobs[id]) {
    const j = await refresh(id);
    if (!j) { alert("任务不存在或已过期"); history.replaceState(null, "", location.pathname); return; }
    remember(j);
  }
  if (current !== id) { current = id; docCache = {}; currentTab = "highlights"; }
  history.replaceState(null, "", `#job=${id}`);
  renderList();
  renderDetail();
  $("detail").scrollIntoView({ behavior: "smooth", block: "start" });
  poll();
}

function renderDetail() {
  const j = jobs[current];
  $("detail").classList.remove("hidden");
  $("dTitle").textContent = j.filename;
  $("dPill").className = `pill ${j.status}`;
  $("dPill").textContent = STATUS[j.status];
  $("dMeta").textContent = [
    `提交于 ${fmtTime(j.created_at)}`,
    fmtDur(j.duration) && `时长 ${fmtDur(j.duration)}`,
    j.detected_language && `语言 ${langName(j.detected_language)}${j.language === "auto" ? "（自动识别）" : ""}`,
    j.summary_lang && j.summary_lang !== "auto" && `纪要用 ${langName(j.summary_lang)}`,
    j.context && `背景：${j.context}`,
  ].filter(Boolean).join(" · ");

  const active = ACTIVE.includes(j.status);
  $("dProgress").classList.toggle("hidden", !active);
  if (active) {
    $("dProgress").querySelector(".bar > div").style.width = (j.status === "summarizing" ? 100 : j.progress || 0) + "%";
    $("dMsg").textContent = statusLine(j) + (j.status === "transcribing" ? " · 1 小时录音大约需要 3–5 分钟" : "");
  }
  $("dErr").textContent = j.status === "failed" ? [j.error || "处理失败", j.message].filter(Boolean).join("\n") : "";
  $("dRetry").classList.toggle("hidden", !(j.status === "failed" && j.files.includes("transcript")));
  $("dActions").classList.toggle("hidden", j.files.length === 0 && !active);
  ["dZip", "dDownload", "dPrint"].forEach((b) => $(b).classList.toggle("hidden", j.files.length === 0));

  renderSpeakers(j, active);

  const tabs = TABS.filter(([k]) => j.files.includes(k));
  if (!tabs.some(([k]) => k === currentTab) && tabs.length) currentTab = tabs[0][0];
  $("dTabs").innerHTML = "";
  for (const [k, label] of tabs) {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = k === currentTab ? "on" : "";
    b.onclick = () => { currentTab = k; renderDetail(); };
    $("dTabs").appendChild(b);
  }
  renderDoc(tabs.length ? currentTab : null);
}

function renderSpeakers(j, active) {
  const spk = j.speakers || [];
  $("dSpeakers").classList.toggle("hidden", spk.length === 0 || active);
  $("dSpkList").textContent = spk.join("、");
  const box = $("dSpkInputs");
  if (box.dataset.for === current + spk.join("|")) return;  // keep what the user is typing
  box.dataset.for = current + spk.join("|");
  box.innerHTML = "";
  for (const label of spk) {
    const wrap = document.createElement("div");
    wrap.style.cssText = "flex:1;min-width:150px";
    const l = document.createElement("label");
    l.textContent = label;
    const input = document.createElement("input");
    input.type = "text"; input.dataset.label = label; input.placeholder = "姓名（不改就留空）";
    wrap.append(l, input);
    box.appendChild(wrap);
  }
}

$("dSpkSave").onclick = async () => {
  const names = {};
  for (const input of $("dSpkInputs").querySelectorAll("input")) {
    if (input.value.trim()) names[input.dataset.label] = input.value.trim();
  }
  if (!Object.keys(names).length) return;
  try {
    jobs[current] = await (await api(`/api/jobs/${current}/speakers`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ names }),
    })).json();
  } catch (e) { alert(e.message); return; }
  docCache = {};
  $("dSpeakers").open = false;
  renderDetail(); renderList(); poll();
};

async function renderDoc(key) {
  const doc = $("dDoc");
  if (!key) { doc.innerHTML = ""; return; }
  if (!(key in docCache)) {
    docCache[key] = null;
    try { docCache[key] = await (await api(`/api/jobs/${current}/files/${key}?inline=1`)).text(); }
    catch (e) { delete docCache[key]; doc.textContent = "加载失败：" + e.message; return; }
  }
  if (key !== currentTab) return;
  const text = docCache[key];
  if (text === null) { doc.textContent = "加载中…"; return; }
  const plain = key === "transcript" || key === "subtitles";
  if (plain || !window.marked || !window.DOMPurify) {
    doc.innerHTML = "<pre></pre>";
    doc.firstChild.textContent = text;
  } else {
    doc.innerHTML = DOMPurify.sanitize(marked.parse(text));
  }
}

$("dZip").onclick = () => { location.href = `/api/jobs/${current}/zip`; };
$("dDownload").onclick = () => { location.href = `/api/jobs/${current}/files/${currentTab}`; };
$("dPrint").onclick = () => window.print();
$("dShare").onclick = async () => {
  const url = `${location.origin}/#job=${current}`;
  try { await navigator.clipboard.writeText(url); $("dShare").textContent = "已复制"; }
  catch { prompt("复制这个链接发给同事：", url); }
  setTimeout(() => ($("dShare").textContent = "复制分享链接"), 2000);
};
$("dRetry").onclick = async () => {
  try { jobs[current] = await (await api(`/api/jobs/${current}/resummarize`, { method: "POST" })).json(); }
  catch (e) { alert(e.message); return; }
  renderDetail(); renderList(); poll();
};

// A share link opened in a tab that already shows this page only changes the hash
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/job=([0-9a-f]{32})/);
  if (m && m[1] !== current) open(m[1]);
});

// ---------- start ----------
let LANGS = {};
const langName = (code) => LANGS[code] || code;

function fillLanguages() {
  const [lang, sumLang] = store.get("mn_langs", ["auto", "auto"]);
  for (const [sel, saved] of [[$("language"), lang], [$("summaryLang"), sumLang]]) {
    for (const [code, name] of Object.entries(LANGS)) sel.add(new Option(name, code));
    if ([...sel.options].some((o) => o.value === saved)) sel.value = saved;
  }
}

async function start() {
  $("upload").classList.remove("hidden");
  await Promise.all(jobIds.map(refresh));
  renderList();
  const m = location.hash.match(/job=([0-9a-f]{32})/);
  if (m) open(m[1]); else poll();
}

(async () => {
  let cfg = {};
  try { cfg = await (await fetch("/api/config")).json(); } catch {}
  LANGS = cfg.languages || {};
  fillLanguages();
  if (cfg.access_code_required) {
    const hadCode = document.cookie.includes("mn_code=");
    const res = await fetch("/api/jobs/" + "0".repeat(32));
    if (res.status === 401) { showGate(hadCode ? "访问码已更改，请重新输入" : ""); return; }
  }
  start();
})();
</script>
